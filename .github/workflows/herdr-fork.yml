name: herdr-fork

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: herdr-fork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: herdr-fork isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          key: herdr-fork
          save-if: ${{ github.event_name == 'push' }}

      - name: Build herdr and herdr-fork
        run: cargo build --locked --features fork --bin herdr --bin herdr-fork

      - name: Run herdr and herdr-fork side by side
        run: scripts/herdr_fork_isolation_smoke.sh target/debug/herdr target/debug/herdr-fork
